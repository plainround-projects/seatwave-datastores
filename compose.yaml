# Module 15: the SeatWave session store. One Redis, published on the loopback address only.
# Image checked on Docker Hub on 11 and 12 November 2026: redis 8.10.3, a Docker Official Image,
# pushed 7 November 2026, with arm64 and amd64 variants; pinned by tag and digest. Nothing runs
# privileged, nothing uses the host network or the Docker socket, and the only folder mounted is
# this project's .secrets/redis, read-only.
# Start and stop it with scripts/stack.sh, which runs scripts/make-acl.sh first and brings
# everything down with "down -v".
name: seatwave-datastores
services:
  redis:
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    command:
      - redis-server
      # Users and their permissions come from the generated ACL file: the default user is off,
      # the session service may send only the commands of S1 to S5, on session keys only.
      - --aclfile
      - /etc/seatwave/users.acl
      # Durability: the append-only file, flushed once a second (at most about 1 s of sessions
      # lost in a crash: those fans sign in again), plus a snapshot every 5 minutes for backups.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "300 100"
      # The lab's 200,000 sessions need about 0.2 GiB (Module 15, Section 6c). noeviction: when
      # memory is full, writes fail loudly and the memory alert fires, instead of fans being
      # signed out.
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:21500:6379"
    volumes:
      # Generated by scripts/make-acl.sh into the ignored .secrets folder; never committed.
      - ./.secrets/redis:/etc/seatwave:ro
      - session-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning --user seatwave_ops --pass "$$(cat /etc/seatwave/ops.password)" ping | grep -q PONG
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  session-data:
